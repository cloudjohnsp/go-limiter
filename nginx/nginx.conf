events {
    worker_connections auto;
}

http {
    # Docker DNS resolver address
    resolver 127.0.0.11 valid=10s;

    # Rate limiting zone for per IP, uses $binary_remote_addr instead of $remote_addr for smaller memory footprint
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;

    # Upstream for the Go API service
    upstream api {
        server api:8080;
        keepalive 32;
    }

    # Main server block for the proxy
    server {
        # Nginx listens on port 80 for HTTP requests
        listen 80;
        # Wildcard server name to match any domain
        server_name _;

        # Health check endpoint in the Go API service
        location = /healthz {
            proxy_pass http://api;
            access_log off;
        }
        # Location block for the API service
        location / {
            # Rate limiting for the API service
            limit_req zone=per_ip burst=20 nodelay;
            limit_req_status 429;

            # Proxy the request to the API service
            proxy_pass http://api;
            proxy_http_version 1.1;

            # Set headers for the API service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Set timeouts for the API service
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}